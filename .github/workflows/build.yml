name: Build geosite rule-sets

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *" # 北京时间 06:30
  push:
    branches: [main]
    paths:
      - geosite.list
      - merge.list
      - geoip.list
      - regex.list
      - patches.list
      - extra/**
      - rule-set/**
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: write
  issues: write

jobs:
  # 定时构建前先看输入有没有比上次发布更新，没有就跳过；手动触发和 push 总是构建
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      upstream: ${{ steps.check.outputs.upstream }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for upstream changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(gh api "repos/${{ github.repository }}/commits/release" --jq .commit.committer.date 2>/dev/null || true)
          read -r upstream t < <(gh api repos/v2fly/domain-list-community/commits/HEAD --jq '.sha+" "+.commit.committer.date')
          times=("$t v2fly/domain-list-community")
          for n in $(sed 's/#.*//' patches.list | grep -oE 'pr:[0-9]+' | cut -d: -f2); do
            times+=("$(gh pr view "$n" -R v2fly/domain-list-community --json updatedAt --jq .updatedAt || true) PR #$n")
          done
          # merge.list 里的 GitHub raw 链接取该文件最后一次提交的时间；其他链接无法判断，视为有变化
          for url in $(sed 's/#.*//' merge.list | grep -oE 'https://[^ ]+'); do
            t=
            if [[ $url =~ ^https://raw\.githubusercontent\.com/([^/]+/[^/]+)/([^/]+)/(.+)$ ]]; then
              t=$(gh api "repos/${BASH_REMATCH[1]}/commits?sha=${BASH_REMATCH[2]}&path=${BASH_REMATCH[3]}&per_page=1" --jq '.[0].commit.committer.date' || true)
            fi
            times+=("$t $url")
          done

          # geoip.list 里的链接取 Last-Modified；拿不到视为有变化。api.github.com 没有这个头，跳过（和 AS 前缀一样，随其他输入变化时顺带刷新）
          for url in $(sed 's/#.*//' geoip.list | grep -oE 'https://[^ ]+' | sed 's/@.*//' | grep -v '^https://api.github.com/' | sort -u); do
            lm=$(curl -fsSI --max-time 30 "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="last-modified"{print $2}')
            t=
            [ -n "$lm" ] && t=$(date -u -d "$lm" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)
            times+=("$t $url")
          done

          echo "上次发布：${since:-无}"
          changed=false
          for x in "${times[@]}"; do
            t=${x%% *}
            echo "$x"
            # 查询失败（时间为空）也当作有变化；ISO 8601 UTC 时间可以直接按字符串比较
            if [ -z "$t" ] || [[ $t > $since ]]; then changed=true; fi
          done
          if [ "${{ github.event_name }}" != schedule ]; then changed=true; fi
          [ "$changed" = false ] && echo "::notice::上次发布后输入没有变化，跳过构建"
          echo "upstream=$upstream" >>"$GITHUB_OUTPUT"
          echo "changed=$changed" >>"$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 固定到 check 时看到的 commit
      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          ref: ${{ needs.check.outputs.upstream }}
          path: community

      # 给 check_redundant 用：只和上游已合并的数据比，未合并的 PR 可能被拒，不能据此删手写规则
      - name: Export unpatched geolocation-cn
        run: (cd community && go run ./ --datapath=./data --outputdir="$GITHUB_WORKSPACE/plain-upstream" --exportlists=geolocation-cn)

      - name: Patch upstream (open PRs + extra/)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/patch_upstream.sh community patches.list extra patched-prs.txt

      - name: Install mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R MetaCubeX/mihomo -p 'mihomo-linux-amd64-compatible-v*.gz' -O mihomo.gz
          gunzip mihomo.gz && chmod +x mihomo
          ./mihomo -v | head -1

      - name: Export plaintext lists with the official v2fly tool
        run: |
          names=$(python3 scripts/build.py --print-export-names)
          mkdir -p plain
          (cd community && go run ./ --datapath=./data --outputdir="$GITHUB_WORKSPACE/plain" --exportlists="$names")

      - name: Convert to mrs
        run: python3 scripts/build.py --plain-dir plain --out-dir dist --mihomo ./mihomo

      - name: Publish to release branch
        run: |
          cd dist
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          msg="Build $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') from v2fly/domain-list-community@$(git -C ../community rev-parse --short HEAD)"
          # 实际应用了的上游 PR
          [ -s ../patched-prs.txt ] && msg="$msg + $(cat ../patched-prs.txt)"
          git commit -q -m "$msg"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" release

      # 放在发布之后：这一步出问题不会影响 release 分支的更新
      - name: Report redundant entries in can-be-direct
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_redundant.py --rule-set rule-set/can-be-direct --plain-dir plain-upstream --against geolocation-cn --out report.md
          title="can-be-direct 中有条目已被 geolocation-cn 收录"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -s report.md ]; then
            if [ -z "$num" ]; then
              gh issue create --title "$title" --body-file report.md
            else
              # 内容没变就不动，避免每天刷新
              old=$(gh issue view "$num" --json body --jq .body | tr -d '\r')
              if [ "$old" != "$(cat report.md)" ]; then
                gh issue edit "$num" --body-file report.md
              fi
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "已经没有可移除的重复条目了，自动关闭。"
          fi
